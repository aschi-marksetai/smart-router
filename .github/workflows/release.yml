name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix: { target: [darwin-arm64, darwin-x64, linux-x64, linux-arm64] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build -- ${{ matrix.target }}
      - run: cd dist && sha256sum smart-router-${{ matrix.target }} > smart-router-${{ matrix.target }}.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/smart-router-${{ matrix.target }}*
  openclaw-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci --ignore-scripts
        working-directory: integrations/openclaw
      - run: |
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          node -e 'const fs=require("fs");const p="openclaw.plugin.json";const m=JSON.parse(fs.readFileSync(p,"utf8"));m.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(m,null,2)+"\n")' "${GITHUB_REF_NAME#v}"
        working-directory: integrations/openclaw
      - run: npm run build && npm test
        working-directory: integrations/openclaw
      - run: mkdir -p ../../dist && npm pack --pack-destination ../../dist
        working-directory: integrations/openclaw
      - run: cd dist && for f in *.tgz; do mv "$f" openclaw-smart-router.tgz; done && sha256sum openclaw-smart-router.tgz > openclaw-smart-router.tgz.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/openclaw-smart-router.tgz*
  update-tap:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: aschi-marksetai/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run formula "${GITHUB_REF_NAME}" > tap/Formula/smart-router.rb
      - run: |
          cd tap
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Formula/smart-router.rb
          git diff --cached --quiet || git commit -m "Update smart-router ${GITHUB_REF_NAME}"
          git push
